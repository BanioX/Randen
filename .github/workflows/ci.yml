name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      # The repo is private, so Actions minutes are limited: a pull request that only touches
      # docs runs licences and format, nothing else; E2E is skipped (a skipped job counts as
      # passed). The register of side effects is read by a unit test, so it counts as code.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          changed="$(git diff --name-only "$BASE" HEAD)"
          if echo "$changed" | grep -qvE '^(docs/.*|.*\.md|LICENSE)$' \
            || echo "$changed" | grep -qxF 'docs/nebenwirkungen.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only docs changed: skipping lint, tests, build and E2E."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Licences (no copyleft in what ships, ADR-0002)
        run: pnpm licenses:check

      - name: Format
        run: pnpm format:check

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Contrast of the colour tokens (ADR-0009)
        if: steps.changes.outputs.code == 'true'
        run: pnpm contrast

      - name: Test with coverage
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:coverage

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: verify
    if: needs.verify.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only the browser: GitHub's Ubuntu runners already ship the system libraries Chromium
      # needs, and `--with-deps` runs apt-get, which can hang for minutes.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm --filter @randen/web exec playwright install chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
